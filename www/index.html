<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pre-Season Bomber</title>
<style>
@font-face{font-family:"Big Shoulders Display";font-weight:600;font-display:swap;src:url(fonts/big-shoulders-display-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:700;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:900;font-display:swap;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}

/* Night game under lights: black ground, footy red, line-marking chalk. The timer is an oval. */
:root{
  --night:#0c0a0b;
  --stand:#171314;
  --seat:#221c1e;
  --red:#e3122f;
  --red-deep:#9e0a1f;
  --chalk:#f4efe6;
  --dim:#a79c9e;
  --turf:#31c374;
  --gold:#f3b53f;
  --line:rgba(244,239,230,.10);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(120% 60% at 0% -10%, rgba(255,240,220,.10), transparent 55%),
    radial-gradient(120% 60% at 100% -10%, rgba(255,240,220,.08), transparent 55%),
    var(--night);
  color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.4;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.disp{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:.92}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--dim)}
h1,h2,h3{margin:0;text-wrap:balance}

/* Scoreboard strip */
.board{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  background:linear-gradient(180deg,#1b1617,#120f10);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05)}
.jumper{width:52px;height:56px;position:relative;display:grid;place-items:center}
.jumper svg{position:absolute;inset:0}
.jumper b{position:relative;font-family:var(--display);font-weight:900;font-size:24px;color:var(--chalk);margin-top:8px}
.who .disp{font-size:24px;font-weight:800}
.who small{display:block;color:var(--dim);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.score{text-align:right}
.score .disp{font-size:34px;font-weight:900;color:var(--chalk)}
.score .disp span{color:var(--red)}
.score small{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-weight:700}
.lvl{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);font-weight:600}
.lvl .bar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red-deep),var(--red));border-radius:6px}
.lvl b{color:var(--gold);text-transform:uppercase;letter-spacing:.06em}

/* Round header */
.round{margin:22px 2px 10px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:4px 12px}
.round h1{font-size:clamp(46px,14vw,60px);font-weight:900;white-space:nowrap}
.round h1 em{font-style:normal;color:var(--red)}
.round .blk{margin-left:auto;padding-bottom:4px;text-align:right;font-size:13px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.round .blk b{display:block;color:var(--chalk);font-family:var(--display);font-size:20px;letter-spacing:.04em}

/* Hero next-up card */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;
  background:linear-gradient(150deg,var(--red) 0%,var(--red-deep) 58%,#4a0610 100%);
  box-shadow:0 18px 40px rgba(227,18,47,.28)}
.hero::after{content:"";position:absolute;right:-70px;top:-40px;width:260px;height:340px;border:3px solid rgba(255,255,255,.16);border-radius:50%;transform:rotate(-18deg)}
.hero::before{content:"";position:absolute;right:20px;top:46px;width:120px;height:160px;border:3px solid rgba(255,255,255,.10);border-radius:50%;transform:rotate(-18deg)}
.hero .tag{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.hero h2{font-size:44px;font-weight:900;margin:6px 0 4px;position:relative;z-index:1}
.hero p{margin:0 0 14px;opacity:.92;font-weight:500;position:relative;z-index:1;max-width:30ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.28)}
.kick{position:relative;z-index:1;margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--chalk);color:#140f10;border-radius:14px;padding:15px;font-family:var(--display);font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;
  box-shadow:0 6px 0 rgba(0,0,0,.25)}
.kick:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}

/* Fixture cards */
.sect{margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sect h3{font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.sect small{color:var(--dim);font-weight:600;font-size:13px}
.fixture{display:grid;gap:10px}
.fx{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--stand);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.fx .day{border-radius:12px;background:var(--seat);text-align:center;padding:7px 0}
.fx .day b{display:block;font-family:var(--display);font-size:22px;font-weight:900;text-transform:uppercase;line-height:1}
.fx .day small{font-size:12px;color:var(--dim);font-weight:600}
.fx .t{font-family:var(--display);font-size:22px;font-weight:800;text-transform:uppercase;line-height:1.02}
.fx .s{font-size:14px;color:var(--dim);margin-top:2px}
.pill{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:999px;white-space:nowrap}
.pill.todo{background:rgba(255,255,255,.07);color:var(--dim)}
.pill.done{background:rgba(49,195,116,.16);color:var(--turf)}
.pill.opt{background:rgba(243,181,63,.14);color:var(--gold)}
.fx.isdone{border-color:rgba(49,195,116,.35)}
.fx.isdone .day{background:rgba(49,195,116,.14)}

/* Ladder */
.ladder{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.rd{border-radius:12px;padding:8px 0 7px;text-align:center;background:var(--stand);border:1px solid var(--line)}
.rd small{display:block;font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.08em}
.rd b{font-family:var(--display);font-size:20px;font-weight:900}
.rd.W b{color:var(--turf)} .rd.D b{color:var(--gold)}
.rd.cur{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.rd.sel{background:var(--seat)}

/* Medals */
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.medal{background:var(--stand);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center}
.medal .m{width:48px;height:48px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:20px;
  background:#2a2325;color:#5a4f52;border:2px dashed #3a3134}
.medal.on .m{background:radial-gradient(circle at 35% 30%,#ffe29a,var(--gold) 55%,#a86d10);color:#3a2603;border:2px solid #ffd77a;box-shadow:0 4px 14px rgba(243,181,63,.35)}
.medal b{display:block;font-size:13px;font-weight:700;line-height:1.15}
.medal small{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.25}

/* Rows (drills) */
.card{background:var(--stand);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .n{font-weight:700;font-size:16.5px}
.row .c{font-size:13.5px;color:var(--dim);margin-top:1px}
.ctl{display:flex;align-items:center;gap:6px}
.step{width:34px;height:34px;border-radius:10px;background:var(--seat);font-size:20px;font-weight:700;display:grid;place-items:center}
.amt{min-width:56px;text-align:center;font-family:var(--display);font-weight:800;font-size:20px}
.amt small{display:block;font-family:var(--body);font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.swap{margin-top:6px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red);padding:4px 0}
.blockhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px}
.blockhead h4{margin:0;font-family:var(--display);font-size:21px;font-weight:800;text-transform:uppercase;color:var(--chalk)}
.blockhead small{color:var(--dim);font-weight:600;font-size:13px}
.simple{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:15px}
.simple:last-child{border-bottom:0}
.simple span:last-child{color:var(--dim);font-weight:600;white-space:nowrap}

/* Detail page */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--dim);padding:6px 0;font-size:15px}
.dhead h2{font-size:52px;font-weight:900;margin-top:8px}
.dhead p{margin:6px 0 0;color:var(--dim)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--stand);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:14px}
.seg button{padding:10px;border-radius:10px;font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;color:var(--dim)}
.seg button.on{background:var(--red);color:#fff}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(180deg,transparent,var(--night) 30%);z-index:5}
.sticky .in{max-width:520px;margin:0 auto;display:grid;gap:8px}
.big{width:100%;border-radius:16px;padding:16px;background:var(--red);color:#fff;font-family:var(--display);font-size:28px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 6px 0 var(--red-deep)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 var(--red-deep)}
.link{font-weight:700;color:var(--dim);padding:6px;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.tip{display:flex;gap:10px;align-items:flex-start;background:rgba(243,181,63,.08);border:1px solid rgba(243,181,63,.22);border-radius:14px;padding:12px;margin-top:14px;font-size:14.5px}
.tip b{color:var(--gold)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:rgba(12,10,11,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:grid;justify-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--chalk)}
.nav button.on svg{color:var(--red)}

/* Locker */
.field{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-size:13px;color:var(--dim);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.field input{background:var(--seat);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--chalk);font:inherit;font-size:17px;width:100%}
.tog{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-weight:600}
.tog:last-child{border-bottom:0}
.sw{width:52px;height:30px;border-radius:30px;background:var(--seat);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
.sw.on{background:var(--red)} .sw.on::after{transform:translateX(22px);background:#fff}
.danger{color:var(--red);font-weight:800;padding:12px 0;letter-spacing:.06em;text-transform:uppercase;font-size:14px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:520px;max-height:86%;overflow:auto;background:#1a1516;border-radius:24px 24px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);border-top:1px solid var(--line);animation:up .22s cubic-bezier(.2,.9,.3,1)}
.grab{width:44px;height:5px;border-radius:5px;background:#3b3235;margin:4px auto 12px}
.sheet h3{font-family:var(--display);font-size:30px;font-weight:900;text-transform:uppercase}
.sheet p{color:var(--dim);margin:6px 0 12px}
.opt{width:100%;text-align:left;display:grid;gap:2px;padding:12px;border-radius:14px;background:var(--stand);border:1px solid var(--line);margin-bottom:8px}
.opt b{font-size:16.5px}
.opt small{color:var(--dim);font-size:13.5px}
.opt.cur{border-color:var(--red)}
.surprise{width:100%;padding:13px;border-radius:14px;background:var(--chalk);color:#140f10;font-family:var(--display);font-size:22px;font-weight:900;text-transform:uppercase;margin-bottom:12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Player */
.player{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--night);
  padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 16px);transition:background .35s}
.player.work{background:radial-gradient(90% 60% at 50% 40%, rgba(227,18,47,.28), transparent 70%),var(--night)}
.player.rest{background:radial-gradient(90% 60% at 50% 40%, rgba(49,195,116,.18), transparent 70%),var(--night)}
.player.ready{background:radial-gradient(90% 60% at 50% 40%, rgba(243,181,63,.18), transparent 70%),var(--night)}
.ptop{display:flex;justify-content:space-between;align-items:center;max-width:520px;width:100%;margin:0 auto}
.ptop .x{width:42px;height:42px;border-radius:12px;background:var(--stand);font-size:22px;display:grid;place-items:center}
.ptop .lab{text-align:center;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ptop .lab b{display:block;color:var(--chalk);font-family:var(--display);font-size:18px;letter-spacing:.06em}
.prog{height:4px;border-radius:4px;background:rgba(255,255,255,.08);max-width:520px;width:100%;margin:10px auto 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--chalk);transition:width .3s}
.oval{position:relative;flex:1;min-height:0;display:grid;place-items:center;max-width:520px;width:100%;margin:6px auto 0}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.oval svg{height:100%;max-height:430px;width:auto;max-width:100%}
.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.center .phase{font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.center .big-t{font-family:var(--display);font-weight:900;font-size:min(30vw,132px);line-height:.9;font-variant-numeric:tabular-nums}
.center .unit{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.pname{text-align:center;max-width:520px;width:100%;margin:6px auto 0}
.pname h2{font-family:var(--display);font-size:clamp(34px,10vw,48px);font-weight:900;text-transform:uppercase;line-height:.95}
.pname p{margin:6px auto 0;color:var(--dim);max-width:34ch;font-size:15px;min-height:2.6em}
.next{display:flex;justify-content:center;margin-top:6px}
.next span{font-size:13px;font-weight:700;color:var(--dim);background:var(--stand);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.next b{color:var(--chalk)}
.pctl{display:grid;grid-template-columns:64px 1fr 64px;gap:12px;align-items:center;max-width:520px;width:100%;margin:14px auto 0}
.pctl .sm{height:64px;border-radius:18px;background:var(--stand);border:1px solid var(--line);display:grid;place-items:center}
.pctl .sm svg{width:26px;height:26px}
.pctl .main{height:72px;border-radius:20px;background:var(--chalk);color:#140f10;font-family:var(--display);font-size:30px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:10px}
.pctl .main.go{background:var(--turf);color:#06210f}
.pctl .main svg{width:26px;height:26px}

/* Finish */
.fin{position:fixed;inset:0;z-index:40;background:radial-gradient(100% 70% at 50% 30%, rgba(227,18,47,.35), var(--night) 72%);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}
.fin .goal{font-family:var(--display);font-weight:900;font-size:min(26vw,150px);line-height:.85;text-transform:uppercase;color:var(--chalk);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.fin .sub{font-family:var(--display);font-size:28px;font-weight:800;text-transform:uppercase;color:var(--red);margin-top:8px}
.fin p{color:var(--dim);max-width:30ch}
.fin .newm{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.fin .newm .medal{width:120px}
.fin .big{max-width:340px;margin-top:16px;font-size:24px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:41}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);background:var(--chalk);color:#140f10;font-weight:700;padding:10px 16px;border-radius:999px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:up .2s;white-space:nowrap}
.enter{animation:fade .25s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<canvas id="confetti" hidden></canvas>
<script>
(function(){
"use strict";

/* ---------------- Exercise library ---------------- */
const EX = {
  squat:{n:'Squats',t:'reps',a:12,cat:'legs',cue:'Feet shoulder-width, chest up, sit back to knee height.',why:'Strong legs mean longer kicks.'},
  jumpsquat:{n:'Squat jumps',t:'reps',a:8,cat:'legs',cue:'Squat down, explode up, land soft and quiet.',why:'Spring for marking contests.'},
  splitsquat:{n:'Split squats',t:'reps',a:8,each:'leg',cat:'legs',cue:'Long stance, drop the back knee straight down.',why:'Single-leg strength for kicking.'},
  wallsit:{n:'Wall sit',t:'time',a:30,cat:'legs',cue:'Back flat on the wall, thighs level with the ground.',why:'Legs that last four quarters.'},
  stepup:{n:'Step-ups',t:'reps',a:8,each:'leg',cat:'legs',cue:'Whole foot on the step, drive up through the heel.',why:'Power for leaping at the ball.'},

/* ---------------- Program logic ---------------- */
function exOf(slot){return EX[S.slots[slot]]?S.slots[slot]:SLOTS[slot].d;}
function amountFor(slot,w){
  const k=exOf(slot),e=EX[k];if(e.t==='skip')return null;
  const p=phaseOf(w);
  const bump=p===0?0:(e.t==='time'?10:(e.cat==='power'||k==='chinneg'?1:2));
  const adj=(S.adj[slot]||0);
  return Math.max(e.t==='time'?10:1,e.a+bump+adj);
}
function amtLabel(e,a){
  if(e.t==='time')return {v:a,u:e.each?'sec each':'sec'};
  return {v:a,u:e.each?('each '+e.each):'reps'};
}
function sunMode(w){return S.sunMode[w]||(w%2===1?'swim':'ride');}

function buildSession(day,w){
  const p=phaseOf(w),R=S.rest,blocks=[];
  const W=(name,dur,cue,extra)=>Object.assign({k:'work',name,dur,cue:cue||''},extra||{});
  const Rs=(name,dur,cue,extra)=>Object.assign({k:'rest',name,dur,cue:cue||''},extra||{});
  const exSteps=(slot,arr,extra)=>{
    const k=exOf(slot),e=EX[k],a=amountFor(slot,w);
    const cue=e.cue+(p===2&&e.t==='reps'&&e.cat!=='power'?' Lower slowly: 3 seconds down.':'');
    if(e.t==='time'){
      if(e.each){arr.push(W(e.n+' · left',a,cue,extra));arr.push(Rs('Switch sides',5,'Swap to the other side.'));arr.push(W(e.n+' · right',a,cue,extra));}
      else arr.push(W(e.n,a,cue,extra));
    } else arr.push(Object.assign({k:'reps',name:e.n,reps:a,unit:e.each?('each '+e.each):'reps',cue},extra||{}));
  };
  if(day==='sat'){
    const wu=[W('Easy jog',180,'Nice and easy. Loosen up.'),W('Leg swings',60,'10 front-to-back and 10 side-to-side each leg.'),
      W('Walking lunges',60,'Long steps, chest tall.'),W('Hip openers + arm circles',60,'Open the gate both ways, then big arm circles.')];
    for(let i=1;i<=3;i++){wu.push(W('Build-up stride '+i+'/3',20,'Start at jog pace, finish at 80%.'));if(i<3)wu.push(Rs('Walk back',40,'Easy walk back to the start.'));}
    blocks.push({name:'Warm-up',steps:wu});
    const n=[6,8,8][p],d=[15,20,20][p],hs=[Rs('Head to the hill',60,'Find a hill you can sprint up for 15–20 seconds.')];
    for(let i=1;i<=n;i++){hs.push(W('Hill sprint '+i+'/'+n,d,'Drive your arms, lean into the hill, quick feet.',{count:'hill'}));if(i<n||p===2)hs.push(Rs('Walk back down',R.hill,'Walk down slowly. Breathe deep.'));}
    if(p===2){for(let i=1;i<=3;i++){hs.push(W('Long hill run '+i+'/3',45,'Strong steady pace all the way up.',{count:'hill'}));if(i<3)hs.push(Rs('Walk back down',90,'Full recovery before the next one.'));}}
    blocks.push({name:'Hill sprints',steps:hs});
    const rounds=p===0?2:3,cs=[Rs('Set up for the circuit',60,'Grab water. Find a flat spot near a low bar.')];
    for(let r=1;r<=rounds;r++){
      SAT_SLOTS.forEach((slot,i)=>{
        exSteps(slot,cs,{count:'set',round:r,rounds});
        const last=i===SAT_SLOTS.length-1;
        if(!last)cs.push(Rs('Quick breather',R.trans,'',{nextSlot:SAT_SLOTS[i+1],round:r,rounds}));
        else if(r<rounds)cs.push(Rs('Round break',R.round,'Drink some water. Next round coming.',{round:r,rounds}));
      });
    }
    blocks.push({name:'Strength circuit',steps:cs,rounds});
    return {day,w,title:'Hills + Strength',sub:'Hill sprints for speed, then a bodyweight circuit.',blocks};
  }
  if(day==='sun'){
    const mode=sunMode(w),ms=[];
    if(mode==='swim'){
      const n=[8,9,10][p];
      ms.push(W('Easy laps',180,'Warm-up. Any stroke, nice and relaxed.'));
      for(let i=1;i<=n;i++){ms.push({k:'reps',name:'Swim 50 m · '+i+'/'+n,reps:50,unit:'metres',cue:'Solid pace. Tap DONE when you touch the wall.'});if(i<n)ms.push(Rs('Rest at the wall',30,'Catch your breath.'));}
      ms.push(W('Easy laps',300,'Cool down. Slow and smooth.'));
      blocks.push({name:'Swim',steps:ms});
    } else {
      const m=[40,45,55][p];
      ms.push(W('Easy spin',300,'Warm up the legs. Low gear.'));
      ms.push(W('Steady ride',m*60,'Talk test: you can still say short sentences. Add any hills you find.'));
      blocks.push({name:'Ride',steps:ms});
    }
    blocks.push({name:'Skipping finisher',steps:skipBlock('sun-skip',w)});
    return {day,w,title:mode==='swim'?'Swim + Skip':'Ride + Skip',sub:mode==='swim'?'Swim sets for your engine, then skipping.':'A steady ride for your engine, then skipping.',blocks,mode};
  }
  if(day==='wed'){
    blocks.push({name:'Skipping',steps:skipBlock('wed-skip',w,true)});
    const cs=[Rs('Get down for core',20,'Find a soft spot on the floor.')];
    for(let r=1;r<=2;r++){WED_CORE.forEach((slot,i)=>{exSteps(slot,cs,{count:'set',round:r,rounds:2});
      if(i<WED_CORE.length-1)cs.push(Rs('Quick breather',R.trans,'',{nextSlot:WED_CORE[i+1]}));else if(r<2)cs.push(Rs('Round break',30,'One more round.'));});}
    blocks.push({name:'Core',steps:cs});
    return {day,w,title:'Skip + Core',sub:'Optional bonus at home. 15 minutes.',blocks};
  }
  return null;
}
function skipBlock(slot,w,noIntro){
  const p=phaseOf(w),n=[6,8,10][p],e=EX[exOf(slot)],st=[];
  if(!noIntro)st.push({k:'rest',name:'Grab the rope',dur:60,cue:'Water, then rope ready.'});
  for(let i=1;i<=n;i++){st.push({k:'work',name:'Skip '+i+'/'+n+' · '+e.n,dur:30,cue:e.cue,count:'skip'});if(i<n)st.push({k:'rest',name:'Rest',dur:S.rest.skip,cue:'Shake out the arms.'});}
  return st;
}
function flatSteps(sess){const out=[];sess.blocks.forEach(b=>b.steps.forEach(s=>out.push(Object.assign({block:b.name},s))));return out;}
function estMin(sess){let t=0;flatSteps(sess).forEach(s=>{t+=s.k==='reps'?(s.unit==='metres'?60:s.reps*(s.unit.startsWith('each')?6:3)+5):s.dur;});return Math.round(t/60);}

/* ---------------- Scoring ---------------- */
function logKey(w,day){return w+'-'+day;}
function isDone(w,day){return !!S.log[logKey(w,day)];}
function weekResult(w){const a=isDone(w,'sat'),b=isDone(w,'sun');return a&&b?'W':(a||b?'D':'');}
function derived(){
  let goals=0,beh=0,wins=0,run=0,best=0,fullWeek=false,sessions=0;
  for(let w=1;w<=8;w++){
    ['sat','sun'].forEach(d=>{if(isDone(w,d)){goals++;sessions++;}});
    ['mon','wed'].forEach(d=>{if(isDone(w,d)){beh++;if(d==='wed')sessions++;}});
    if(weekResult(w)==='W'){wins++;run++;best=Math.max(best,run);}else run=0;
    if(['mon','wed','sat','sun'].every(d=>isDone(w,d)))fullWeek=true;
  }
  const st=Object.assign({},S.stats,{sessions,wins,bestRun:best,fullWeek,won4:weekResult(4)==='W'});
  const medals=MEDALS.filter(m=>m.ok(st)).map(m=>m.id);
  beh+=medals.length;
  const pts=goals*6+beh;
  let li=0;LEVELS.forEach((l,i)=>{if(pts>=l[0])li=i;});
  const nextL=LEVELS[li+1];
  const frac=nextL?(pts-LEVELS[li][0])/(nextL[0]-LEVELS[li][0]):1;
  return {goals,beh,pts,medals,level:LEVELS[li][1],next:nextL,frac,wins};
}

  try{const pend=await NP.LocalNotifications.getPending();if(pend&&pend.notifications&&pend.notifications.length)await NP.LocalNotifications.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});}catch(e){}
}
async function scheduleAhead(){
  if(!notifReady||!P||P.paused)return;
  const s=cur();if(s.k==='reps')return;
  let t=Date.now()+Math.max(0,(s.dur-elapsed()))*1000;
  const list=[];
  for(let j=P.i+1;j<P.steps.length&&list.length<40;j++){
    const n=P.steps[j];
    const body=n.k==='rest'?(n.name+' · '+fmtT(n.dur)):(n.k==='reps'?(n.name+' · '+n.reps+' '+n.unit+'. Open the app and tap Done.'):(n.name+' · '+fmtT(n.dur)));
    list.push({id:2000+j,title:n.k==='rest'?'Rest':'Go!',body,channelId:'timer',schedule:{at:new Date(t),allowWhileIdle:true},smallIcon:'ic_stat_ball',iconColor:'#E3122F'});
    if(n.k==='reps')break;
    t+=n.dur*1000;
  }
  if(list.length===0||P.i===P.steps.length-1){list.push({id:2999,title:'Session finished!',body:'Open the app to bank your goal.',channelId:'timer',schedule:{at:new Date(t),allowWhileIdle:true},smallIcon:'ic_stat_ball'});}
  try{await NP.LocalNotifications.schedule({notifications:list});}catch(e){}
}

function beep(f,len,vol){const a=audio();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(vol||.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+len);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+len);}catch(e){}}

  const vk=(detail||'')+tab+viewWeek,anim=vk!==lastView;lastView=vk;
  let html='<div class="app'+(anim?' enter':'')+'">';
  if(detail)html+=detailView(detail);
  else if(tab==='home')html+=board(D)+homeView(D);
  else if(tab==='drills')html+=drillsView();
  else if(tab==='medals')html+=medalsView(D);
  else html+=lockerView();
  html+='</div>';
  if(!detail)html+=navBar();
  root.innerHTML=html;
  if(!S.onboarded&&!sheetOpen)openOnboard();
}
function board(D){
  const name=S.name||'Champ';
  return `<div class="board">
    <div class="jumper">${jumperSVG()}<b class="num">${esc(S.num||'—')}</b></div>
    <div class="who"><div class="disp">${esc(name)}</div><small>Pre-season 2026/27</small></div>
    <div class="score"><div class="disp num">${D.goals}<span>.</span>${D.beh} <span style="color:var(--chalk)">(${D.pts})</span></div><small>Season score</small></div>
    <div class="lvl"><b>${D.level}</b><div class="bar"><i style="width:${Math.round(D.frac*100)}%"></i></div><span class="num">${D.next?(D.next[0]-D.pts)+' pts to '+D.next[1]:'Top rank!'}</span></div>
  </div>`;
}
function homeView(D){
  const w=viewWeek,p=phaseOf(w),cw=currentWeek();
  const order=['sat','sun'];
  const nextDay=order.find(d=>!isDone(w,d));
  let hero='';
  if(nextDay){
    const s=buildSession(nextDay,w);
    hero=`<div class="hero">
      <div class="tag">${nm()?esc(nm())+', you\'re up':'Next up'} · ${fmt(dayDate(w,nextDay))}</div>
      <h2 class="disp">${s.title}</h2>
      <p>${s.sub}</p>
      <div class="chips"><span class="chip">~${estMin(s)} min</span>${s.blocks.map(b=>`<span class="chip">${b.name}</span>`).join('')}</div>
      <button class="kick" data-open="${nextDay}">${IC.ball} Let's go</button>
    </div>`;
  } else {
    hero=`<div class="hero"><div class="tag">Round ${w} result</div><h2 class="disp">Round won!</h2><p>Both main sessions done. ${w<8?'Round '+(w+1)+' starts '+fmt(dayDate(w+1,'mon'))+'.':'That\'s the whole pre-season. Premiers!'}</p>
      ${w<8?`<button class="kick" data-week="${w+1}">Go to round ${w+1}</button>`:''}</div>`;
  }
  const fx=[['mon','Footy training','At the club. Tick it off after.'],['wed','Skip + Core','Optional bonus · 15 min'],['sat','Hills + Strength','~'+estMin(buildSession('sat',w))+' min'],['sun',buildSession('sun',w).title,'~'+estMin(buildSession('sun',w))+' min']];
  return `
  <div class="round"><h1 class="disp">Round <em class="num">${w}</em></h1><div class="blk">${PHASES[p].weeks}<b>${PHASES[p].name}</b></div></div>
  ${w!==cw?`<div class="muted" style="margin:-4px 2px 10px;font-size:14px">Viewing round ${w}. <button class="link" data-week="${cw}">Back to this week</button></div>`:''}
  ${hero}
  <div class="sect"><h3>This round</h3><small>${fmt(dayDate(w,'mon'))} – ${fmt(dayDate(w,'sun'))}</small></div>
  <div class="fixture">${fx.map(([d,t,s])=>{const done=isDone(w,d);
    const pill=done?'<span class="pill done">Done</span>':(d==='wed'?'<span class="pill opt">Bonus</span>':'<span class="pill todo">To play</span>');
    const dd=dayDate(w,d);
    return `<button class="fx ${done?'isdone':''}" data-open="${d}"><div class="day"><b>${dd.toLocaleDateString('en-AU',{weekday:'short'})}</b><small>${dd.getDate()} ${dd.toLocaleDateString('en-AU',{month:'short'})}</small></div><div><div class="t">${t}</div><div class="s">${s}</div></div>${pill}</button>`;}).join('')}</div>

  <div class="ladder">${[1,2,3,4,5,6,7,8].map(r=>{const res=weekResult(r);return `<button class="rd ${res} ${r===cw?'cur':''} ${r===w?'sel':''}" data-week="${r}" aria-label="Round ${r}"><small>RD</small><b class="num">${r}</b><small>${res||'·'}</small></button>`;}).join('')}</div>
  <div class="tip"><span>${IC.ball}</span><div><b>${PHASES[p].name}:</b> ${PHASES[p].note} Win a round by finishing Saturday and Sunday. Each one kicks a goal (6 points). Footy, the Wednesday bonus and medals are behinds (1 point).</div></div>`;

function navBar(){
  const b=(id,l)=>`<button class="${tab===id?'on':''}" data-tab="${id}">${IC[id]}<span>${l}</span></button>`;
  return `<nav class="nav"><div class="in">${b('home','Rounds')}${b('drills','Drills')}${b('medals','Medals')}${b('locker','Locker')}</div></nav>`;

function slotRow(slot,w){
  const k=exOf(slot),e=EX[k];
  if(e.t==='skip')return `<div class="row"><div><div class="n">${e.n}</div><div class="c">${e.cue}</div><button class="swap" data-swap="${slot}">Swap style</button></div><div class="amt">30<small>sec</small></div></div>`;
  const a=amountFor(slot,w),L=amtLabel(e,a);
  return `<div class="row"><div><div class="n">${e.n}</div><div class="c">${e.cue}</div><button class="swap" data-swap="${slot}">Swap exercise</button></div>
    <div class="ctl"><button class="step" data-adj="${slot}" data-d="-1" aria-label="Less">−</button><div class="amt num">${L.v}<small>${L.u}</small></div><button class="step" data-adj="${slot}" data-d="1" aria-label="More">+</button></div></div>`;
}
function detailView(day){
  const w=viewWeek,dd=dayDate(w,day),done=isDone(w,day);
  if(day==='mon'){
    return `<button class="back" data-back>← Rounds</button>
    <div class="dhead"><div class="muted" style="font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px">Round ${w} · ${fmt(dd)}</div><h2 class="disp">Footy Training</h2><p>Club training counts. Give it everything, then tick it off for a behind.</p></div>
    <div class="tip"><span>${IC.ball}</span><div><b>Rest tomorrow.</b> Tuesday is a rest day so your legs are fresh for the week.</div></div>
    <div class="sticky"><div class="in"><button class="big" data-markmon>${done?'Trained ✓ (tap to undo)':'I trained tonight'}</button></div></div>`;
  }
  const s=buildSession(day,w);
  let blocks='';
  s.blocks.forEach(b=>{
    blocks+=`<div class="blockhead"><h4>${b.name}</h4><small>${blockSummary(b)}</small></div>`;
    if(b.name==='Strength circuit')blocks+=`<div class="card">${SAT_SLOTS.map(sl=>slotRow(sl,w)).join('')}</div>`;
    else if(b.name==='Core')blocks+=`<div class="card">${WED_CORE.map(sl=>slotRow(sl,w)).join('')}</div>`;
    else if(b.name.startsWith('Skipping'))blocks+=`<div class="card">${slotRow(day==='wed'?'wed-skip':'sun-skip',w)}</div>`;
    else blocks+=`<div class="card">${compactSteps(b.steps)}</div>`;
  });
  return `<button class="back" data-back>← Rounds</button>
  <div class="dhead"><div class="muted" style="font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px">Round ${w} · ${fmt(dd)} · ~${estMin(s)} min</div><h2 class="disp">${s.title}</h2><p>${s.sub}</p></div>
  ${day==='sun'?`<div class="seg" role="group" aria-label="Swim or ride"><button class="${s.mode==='swim'?'on':''}" data-mode="swim">Swim</button><button class="${s.mode==='ride'?'on':''}" data-mode="ride">Ride</button></div>`:''}
  ${blocks}
  ${done?`<div class="tip"><span>${IC.tick}</span><div><b>Already done this round.</b> You can run it again any time, but it only scores once. <button class="link" data-undo="${day}">Undo</button></div></div>`:''}
  <div style="text-align:center;margin-top:14px">${done?'':`<button class="link" data-markdone="${day}">I did this without the app</button>`}</div>
  <div style="height:90px"></div>
  <div class="sticky"><div class="in"><button class="big" data-start="${day}">${done?'Run it again':'Kick off'}</button></div></div>`;
}
function blockSummary(b){
  if(b.rounds)return b.rounds+' rounds';
  const work=b.steps.filter(s=>s.k!=='rest');
  if(b.name==='Hill sprints'){const h=work.filter(s=>s.count==='hill');return h.length+' efforts';}
  if(b.name.startsWith('Skip'))return work.length+' × 30 sec';
  const t=b.steps.reduce((a,s)=>a+(s.dur||0),0);return Math.round(t/60)+' min';
}
function compactSteps(steps){
  const rows=[];
  steps.filter(s=>s.k!=='rest').forEach(s=>{
    const base=s.name.replace(/\s\d+\/\d+.*$/,'');
    const last=rows[rows.length-1];
    if(last&&last.base===base&&last.val===val(s)){last.n++;}else rows.push({base,val:val(s),n:1});
  });
  return rows.map(r=>`<div class="simple"><span>${r.n>1?r.n+' × ':''}${esc(r.base)}</span><span class="num">${r.val}</span></div>`).join('');
  function val(s){return s.k==='reps'?(s.unit==='metres'?s.reps+' m':s.reps+' '+s.unit):fmtT(s.dur);}
}
function fmtT(sec){sec=Math.max(0,Math.ceil(sec));if(sec<60)return sec+' sec';const m=Math.floor(sec/60),s=sec%60;return s?m+':'+String(s).padStart(2,'0')+' min':m+' min';}

/* ---------------- Sheets ---------------- */
let sheetOpen=false;
function sheet(html,onClick){
  closeSheet();sheetOpen=true;
  const el=document.createElement('div');el.className='scrim';el.id='scrim';
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  el.addEventListener('click',e=>{if(e.target===el){closeSheet();return;}onClick&&onClick(e);});
  document.body.appendChild(el);
}
function closeSheet(){const s=document.getElementById('scrim');if(s)s.remove();sheetOpen=false;}
function openSwap(slot){
  const cur=exOf(slot),cat=EX[cur].cat;
  const opts=Object.keys(EX).filter(k=>EX[k].cat===cat);
  sheet(`<h3>Swap ${CAT[cat]}</h3><p>Pick something new. It works the same muscles.</p>
    <button class="surprise" data-pick="__rand">Surprise me</button>
    ${opts.map(k=>`<button class="opt ${k===cur?'cur':''}" data-pick="${k}"><b>${EX[k].n}${k===cur?' · current':''}</b><small>${EX[k].why} ${EX[k].cue}</small></button>`).join('')}`,
  e=>{const b=e.target.closest('[data-pick]');if(!b)return;let k=b.dataset.pick;
    if(k==='__rand'){const o=opts.filter(x=>x!==cur);k=o[Math.floor(Math.random()*o.length)];}
    if(k!==cur){S.slots[slot]=k;delete S.adj[slot];S.stats.swaps++;save();toast('Swapped in '+EX[k].n);}
    closeSheet();render();});
}
function confirmSheet(title,text,yes,fn){
  sheet(`<h3>${title}</h3><p>${text}</p><button class="big" data-yes>${yes}</button><div style="text-align:center;margin-top:8px"><button class="link" data-no>Cancel</button></div>`,
  e=>{if(e.target.closest('[data-yes]')){closeSheet();fn();}else if(e.target.closest('[data-no]'))closeSheet();});
}
function openOnboard(){
  sheet(`<h3>Welcome to pre-season</h3><p>Eight rounds of training with Dad. Put your name and number on the jumper. The voice coach will call you by name.</p>
  <div class="field"><label for="o-name">Your name</label><input id="o-name" maxlength="16" autocomplete="off" placeholder="First name"></div>
  <div class="field"><label for="o-num">Jumper number</label><input id="o-num" inputmode="numeric" maxlength="2" placeholder="e.g. 9"></div>

  e=>{if(!e.target.closest('[data-go]'))return;S.name=document.getElementById('o-name').value.trim();S.num=document.getElementById('o-num').value.replace(/\D/g,'').slice(0,2);S.onboarded=true;save();closeSheet();render();});
}
function toast(t){const o=document.querySelector('.toast');if(o)o.remove();const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800);}

/* ---------------- Events ---------------- */
root.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.tab){tab=d.tab;detail=null;render();scrollTo(0,0);}
  else if(d.open){detail=d.open;render();scrollTo(0,0);}
  else if(d.back!==undefined){detail=null;render();scrollTo(0,0);}
  else if(d.week){viewWeek=+d.week;detail=null;tab='home';render();}
  else if(d.swap){openSwap(d.swap);}
  else if(d.adj){const slot=d.adj,e2=EX[exOf(slot)],step=e2.t==='time'?5:1,old=S.adj[slot]||0,v0=amountFor(slot,viewWeek);
    S.adj[slot]=old+step*(+d.d);
    const v1=amountFor(slot,viewWeek),max=e2.t==='time'?120:40;
    if(v1===v0||v1>max)S.adj[slot]=old;save();render();}
  else if(d.mode){S.sunMode[viewWeek]=d.mode;save();render();}
  else if(d.start){startPlayer(d.start);}
  else if(d.markdone){complete(d.markdone,null,true);}
  else if(d.markmon!==undefined){if(isDone(viewWeek,'mon'))delete S.log[logKey(viewWeek,'mon')];else{const before=derived().medals;S.log[logKey(viewWeek,'mon')]={at:Date.now()};save();const nm=derived().medals.filter(m=>!before.includes(m));toast(nm.length?'Behind! + new medal':'Behind! +1 point');}save();render();}
  else if(d.undo){confirmSheet('Undo this session?','It comes off your score for round '+viewWeek+'.','Undo it',()=>{delete S.log[logKey(viewWeek,d.undo)];save();render();});}
  else if(d.tog){S[d.tog]=!S[d.tog];save();render();}
  else if(d.rest){S.rest[d.rest]=Math.max(5,Math.min(240,S.rest[d.rest]+(+d.d)));save();render();}
  else if(d.resetdrills!==undefined){confirmSheet('Back to the original plan?','All swaps and rep changes are cleared.','Reset drills',()=>{S.slots={};S.adj={};save();render();});}
  else if(d.reset!==undefined){confirmSheet('Reset the whole season?','This clears every result, medal and setting on this phone.','Reset everything',()=>{S=JSON.parse(JSON.stringify(DEFAULT));save();viewWeek=currentWeek();tab='home';render();});}
});
root.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='f-name'){S.name=e.target.value.trim();save();}
  if(id==='f-num'){S.num=e.target.value.replace(/\D/g,'').slice(0,2);save();}
  if(id==='f-start'&&e.target.value){S.start=e.target.value;viewWeek=currentWeek();save();}
});

/* ---------------- Player ---------------- */
let P=null,timerId=null;
function startPlayer(day){
  const sess=buildSession(day,viewWeek);
  const steps=[{k:'ready',name:'Get ready',dur:5,cue:'First up: '+firstWork(sess),block:sess.blocks[0].name}].concat(flatSteps(sess));
  P={day,w:viewWeek,sess,steps,i:0,start:performance.now(),paused:false,pausedAt:0,acc:0,lastBeep:null,counts:{sets:0,hills:0,skips:0}};
  audio();wake(true);prepNotifs();
  const el=document.createElement('div');el.className='player';el.id='player';document.body.appendChild(el);
  el.addEventListener('click',playerClick);
  enterStep();
  timerId=setInterval(tick,200);
}
function firstWork(sess){const s=flatSteps(sess).find(x=>x.k!=='rest');return s?s.name:'';}
function cur(){return P.steps[P.i];}
function elapsed(){return ((P.paused?P.pausedAt:performance.now())-P.start-P.acc)/1000;}
function enterStep(){
  const s=cur();P.start=performance.now();P.acc=0;P.paused=false;P.lastBeep=null;
  if(s.k==='work'){beep(880,.35);buzz([180]);say(s.name.replace(/\s\d+\/\d+/,'').replace(' · ',', ')+'. Go!');}
  else if(s.k==='rest'){beep(520,.3);buzz([90,60,90]);const nx=nextWorkName();say(s.name+(nx?'. Next, '+nx.replace(/\s\d+\/\d+/,'').replace(' · ',', '):''));}
  else if(s.k==='reps'){beep(880,.35);buzz([180]);say(s.name.replace(/\s·\s\d+\/\d+/,'')+'. '+(s.unit==='metres'?'':s.reps+' '+s.unit.replace('each','each'))+'.');}
  else if(s.k==='ready'){say((nm()?'Righto '+nm()+', get ready. ':'Get ready. ')+s.cue);}
  drawPlayer(true);
}
function nextWorkName(){for(let j=P.i+1;j<P.steps.length;j++){if(P.steps[j].k!=='rest')return P.steps[j].name;}return '';}
function tick(){
  if(!P||P.paused)return;
  const s=cur();
  if(s.k==='reps'){drawPlayer();return;}
  let left=s.dur-elapsed();
  if(left<=0){
    /* catch up if the phone was locked: carry leftover time into the next steps */
    let over=-left,guard=0;
    countStep(s);P.i++;
    while(P.i<P.steps.length&&P.steps[P.i].k!=='reps'&&over>=P.steps[P.i].dur&&guard++<500){over-=P.steps[P.i].dur;countStep(P.steps[P.i]);P.i++;}
    if(P.i>=P.steps.length){finishPlayer();return;}
    if(over>1.5){P.start=performance.now()-over*1000;P.acc=0;P.paused=false;P.lastBeep=null;drawPlayer(true);}
    else enterStep();
    return;
  }
  const whole=Math.ceil(left);
  if(whole<=3&&whole>=1&&P.lastBeep!==whole){P.lastBeep=whole;beep(660,.12);}
  drawPlayer();
}
function countStep(s){if(s.count==='set')P.counts.sets++;else if(s.count==='hill')P.counts.hills++;else if(s.count==='skip')P.counts.skips++;}
function advance(dir){
  const s=cur();
  if(dir>0&&(s.k==='work'||s.k==='reps'))countStep(s);
  P.i+=dir;
  if(P.i<0)P.i=0;
  if(P.i>=P.steps.length){finishPlayer();return;}
  enterStep();
}
function ovalSVG(frac,mode){
  const cx=150,cy=180,rx=128,ry=166;
  const col=mode==='work'?'#e3122f':mode==='rest'?'#31c374':'#f3b53f';
  const th=-Math.PI/2+2*Math.PI*Math.min(1,Math.max(0,frac));
  const bx=cx+rx*Math.cos(th),by=cy+ry*Math.sin(th);
  const ang=Math.atan2(ry*Math.cos(th),-rx*Math.sin(th))*180/Math.PI;
  return `<svg viewBox="0 0 300 360" aria-hidden="true">
    <defs><radialGradient id="g" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#1d3a28"/><stop offset="1" stop-color="#0e1a13"/></radialGradient></defs>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#g)" opacity=".55"/>
    <g fill="none" stroke="rgba(244,239,230,.16)" stroke-width="1.6">
      <rect x="125" y="155" width="50" height="50"/>
      <circle cx="150" cy="180" r="9"/>
      <path d="M90 ${cy-ry+18} A70 62 0 0 0 210 ${cy-ry+18}"/>
      <path d="M90 ${cy+ry-18} A70 62 0 0 1 210 ${cy+ry-18}"/>
      <rect x="138" y="${cy-ry+2}" width="24" height="10"/>
      <rect x="138" y="${cy+ry-12}" width="24" height="10"/>
    </g>
    <g stroke="rgba(244,239,230,.55)" stroke-width="2.4" stroke-linecap="round">
      <path d="M140 ${cy-ry} v-12 M160 ${cy-ry} v-12 M132 ${cy-ry+1} v-7 M168 ${cy-ry+1} v-7"/>
      <path d="M140 ${cy+ry} v12 M160 ${cy+ry} v12 M132 ${cy+ry-1} v7 M168 ${cy+ry-1} v7"/>
    </g>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="rgba(244,239,230,.10)" stroke-width="12"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="${(frac*100).toFixed(2)} 100" transform="rotate(-90 ${cx} ${cy})" style="filter:drop-shadow(0 0 8px ${col}88)"/>
    <g transform="translate(${bx.toFixed(1)} ${by.toFixed(1)}) rotate(${ang.toFixed(1)})">
      <ellipse rx="13" ry="8.5" fill="#c8102e" stroke="#fff" stroke-width="1.6"/>
      <path d="M-5 0h10" stroke="#fff" stroke-width="1.4" stroke-dasharray="1.6 1.3"/>
    </g>
  </svg>`;
}
let lastI=-1;
function drawPlayer(full){
  const el=document.getElementById('player');if(!el)return;
  const s=cur(),mode=s.k==='reps'?'work':s.k;
  el.className='player '+mode;
  let frac,big,unit,phase;
  if(s.k==='reps'){const t=elapsed();frac=(t%60)/60;big=s.reps;unit=s.unit;phase='Reps · '+Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');}
  else{const left=Math.max(0,s.dur-elapsed());frac=1-left/s.dur;big=fmtClock(left);unit=s.dur>=60?'min':'sec';phase=s.k==='work'?'Work':s.k==='rest'?'Rest':'Get ready';}
  if(full||lastI!==P.i){
    lastI=P.i;
    const nx=nextStepLabel();
    const roundTxt=s.round?` · Round ${s.round}/${s.rounds}`:'';
    const sub=s.nextSlot?('Next: '+EX[exOf(s.nextSlot)].n):s.cue;
    el.innerHTML=`
      <div class="ptop"><button class="x" data-p="exit" aria-label="Stop session">✕</button><div class="lab">${esc(s.block)}${roundTxt}<b class="num">${P.i+1} / ${P.steps.length}</b></div><button class="x" data-p="mute" aria-label="Sound on or off">${S.sound?'🔊':'🔈'}</button></div>
      <div class="prog"><i style="width:${(P.i/P.steps.length*100).toFixed(1)}%"></i></div>
      <div class="oval"><div id="ov">${ovalSVG(frac,mode)}</div><div class="center"><div><div class="phase" id="ph" style="color:${mode==='work'?'#ff5a6e':mode==='rest'?'var(--turf)':'var(--gold)'}">${phase}</div><div class="big-t" id="bt">${big}</div><div class="unit" id="un">${unit}</div></div></div></div>
      <div class="pname"><h2>${esc(s.name)}</h2><p>${esc(sub)}</p></div>
      <div class="next">${nx?`<span>Then: <b>${esc(nx)}</b></span>`:'<span><b>Last one'+(nm()?', '+esc(nm()):'')+'!</b></span>'}</div>
      <div class="pctl"><button class="sm" data-p="prev" aria-label="Previous">${IC.prev}</button>
        ${s.k==='reps'?`<button class="main go" data-p="done">${IC.tick} Done</button>`:`<button class="main" data-p="pause" id="pp">${P.paused?IC.play+' Resume':IC.pause+' Pause'}</button>`}
        <button class="sm" data-p="next" aria-label="${s.k==='rest'?'Skip rest':'Next'}">${IC.next}</button></div>`;
  } else {
    const ov=document.getElementById('ov');if(ov)ov.innerHTML=ovalSVG(frac,mode);
    const bt=document.getElementById('bt');if(bt)bt.textContent=big;
    const ph=document.getElementById('ph');if(ph)ph.textContent=phase;
    const un=document.getElementById('un');if(un)un.textContent=unit;
  }
}
function nextStepLabel(){const n=P.steps[P.i+1];if(!n)return '';if(n.k==='rest')return n.name+' '+fmtT(n.dur);return n.name+(n.k==='reps'?' × '+n.reps:' '+fmtT(n.dur));}
function fmtClock(sec){sec=Math.max(0,Math.ceil(sec));const m=Math.floor(sec/60),s=sec%60;return m?m+':'+String(s).padStart(2,'0'):String(s);}
function playerClick(e){
  const b=e.target.closest('[data-p]');if(!b)return;const a=b.dataset.p;
  audio();
  if(a==='pause'){if(P.paused){P.acc+=performance.now()-P.pausedAt;P.paused=false;}else{P.paused=true;P.pausedAt=performance.now();if(window.speechSynthesis)speechSynthesis.cancel();}drawPlayer(true);}
  else if(a==='next'||a==='done'){advance(1);}
  else if(a==='prev'){if(elapsed()>3&&cur().k!=='reps'){enterStep();}else advance(-1);}
  else if(a==='mute'){S.sound=!S.sound;S.voice=S.sound;save();drawPlayer(true);}
  else if(a==='exit'){
    const wasPaused=P.paused;if(!wasPaused){P.paused=true;P.pausedAt=performance.now();}
    sheet(`<h3>Stop the session?</h3><p>You're ${Math.round(P.i/P.steps.length*100)}% through. Stopping now doesn't count for the round.</p><button class="big" data-keep>Keep going</button><div style="text-align:center;margin-top:8px"><button class="link" data-stop>Stop session</button></div>`,
      ev=>{if(ev.target.closest('[data-keep]')){closeSheet();if(!wasPaused){P.acc+=performance.now()-P.pausedAt;P.paused=false;}drawPlayer(true);}
           else if(ev.target.closest('[data-stop]')){closeSheet();stopPlayer();}});
    document.getElementById('scrim').style.zIndex=35;
  }
}
function stopPlayer(){cancelNotifs();clearInterval(timerId);timerId=null;wake(false);if(window.speechSynthesis)speechSynthesis.cancel();const el=document.getElementById('player');if(el)el.remove();P=null;render();}
function finishPlayer(){
  const p=P;cancelNotifs();clearInterval(timerId);timerId=null;wake(false);
  const el=document.getElementById('player');if(el)el.remove();
  P=null;
  complete(p.day,p.counts,false,p.w);
}
function complete(day,counts,manual,w){
  w=w||viewWeek;
  const before=derived();
  const already=isDone(w,day);
  const resBefore=weekResult(w);
  if(counts){S.stats.sets+=counts.sets;S.stats.hills+=counts.hills;S.stats.skips+=counts.skips;}
  else if(manual){const s=buildSession(day,w),f=flatSteps(s);f.forEach(x=>{if(x.count==='set')S.stats.sets++;if(x.count==='hill')S.stats.hills++;if(x.count==='skip')S.stats.skips++;});}
  if(!already)S.log[logKey(w,day)]={at:Date.now(),manual:!!manual};
  save();
  const after=derived();
  const newM=MEDALS.filter(m=>after.medals.includes(m.id)&&!before.medals.includes(m.id));
  const isGoal=(day==='sat'||day==='sun');
  const won=resBefore!=='W'&&weekResult(w)==='W';
  siren();buzz([200,100,200,100,400]);
  if(S.voice)say(already?'Session done. Great work'+(nm()?', '+nm():'')+'.':(isGoal?'Goal! Great work'+(nm()?', '+nm():'')+'.':'Behind! Nice bonus work'+(nm()?', '+nm():'')+'.'));
  root.innerHTML='';
  const fin=document.createElement('div');fin.className='fin';fin.id='fin';
  fin.innerHTML=`<div class="goal">${already?'Done!':(isGoal?'Goal!':'Behind!')}</div>
    <div class="sub">${already?'Extra session':(isGoal?'+6 points':'+1 point')}</div>
    ${won&&!already?`<p style="color:var(--chalk);font-weight:700;font-size:18px">Round ${w} won!</p>`:''}
    ${nm()?`<p style="color:var(--chalk);font-family:var(--display);font-size:26px;font-weight:800;text-transform:uppercase;margin:12px 0 0">Well played, ${esc(nm())}${S.num?' · #'+esc(S.num):''}</p>`:''}
    <p>Score now <b class="num" style="color:var(--chalk)">${after.goals}.${after.beh} (${after.pts})</b> · ${after.level}</p>
    ${newM.length?`<div class="newm">${newM.map(m=>`<div class="medal on"><div class="m">${m.m}</div><b>${m.n}</b><small>New medal · +1</small></div>`).join('')}</div>`:''}
    <button class="big" id="finok">Back to the rooms</button>`;
  document.body.appendChild(fin);
  confetti();
  document.getElementById('finok').onclick=()=>{fin.remove();document.getElementById('confetti').hidden=true;detail=null;tab='home';render();scrollTo(0,0);};
}

/* ---------------- Confetti ---------------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('confetti');c.hidden=false;const x=c.getContext('2d');
  const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;
  const cols=['#e3122f','#f4efe6','#111','#e3122f','#f3b53f'];
  const ps=Array.from({length:140},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.025-H*.008,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,s:(6+Math.random()*8)*devicePixelRatio,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function loop(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=H*.0009;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++f<170&&document.getElementById('fin'))requestAnimationFrame(loop);else{x.clearRect(0,0,W,H);c.hidden=true;}})();
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){cancelNotifs();if(P){wake(true);tick();}}
  else if(P&&!P.paused){scheduleAhead();}
});
if(NATIVE&&NP.App){NP.App.addListener('backButton',()=>{
  if(sheetOpen){closeSheet();return;}
  if(P){const x=document.querySelector('#player [data-p="exit"]');if(x)x.click();return;}
  if(document.getElementById('fin')){const b=document.getElementById('finok');if(b)b.click();return;}
  if(detail){detail=null;render();scrollTo(0,0);return;}
  if(tab!=='home'){tab='home';render();scrollTo(0,0);return;}
  NP.App.minimizeApp&&NP.App.minimizeApp();
});
NP.App.addListener('appStateChange',st=>{if(st.isActive){cancelNotifs();if(P)tick();}else if(P&&!P.paused)scheduleAhead();});}

/* expose for tests */
window.__app={buildSession,flatSteps,estMin,derived,amountFor,S:()=>S,setState:o=>{S=deepMerge(JSON.parse(JSON.stringify(DEFAULT)),o);save();viewWeek=currentWeek();render();},phaseOf,setWeek:w=>{viewWeek=w;render();}};

render();
})();
</script>
