<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pre-Season Bomber</title>
<style>
@font-face{font-family:"Big Shoulders Display";font-weight:600;font-display:swap;src:url(fonts/big-shoulders-display-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:700;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:900;font-display:swap;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}

/* Night game under lights: black ground, the sport's colour, line-marking chalk. The timer is the sport's field. */
:root{
  --night:#0c0a0b;
  --stand:#171314;
  --seat:#221c1e;
  --red:#e3122f;
  --red-deep:#9e0a1f;
  --chalk:#f4efe6;
  --dim:#a79c9e;
  --turf:#31c374;
  --gold:#f3b53f;
  --abyss:#4a0610;
  --on:#ffffff;
  --hero1:var(--red);
  --rest:#31c374;
  --line:rgba(244,239,230,.10);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(120% 60% at 0% -10%, rgba(255,240,220,.10), transparent 55%),
    radial-gradient(120% 60% at 100% -10%, rgba(255,240,220,.08), transparent 55%),
    var(--night);
  color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.4;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(var(--safe-area-inset-top,env(safe-area-inset-top)) + 14px) 16px calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom)) + 96px)}
.disp{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:.92}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--dim)}
h1,h2,h3{margin:0;text-wrap:balance}

/* Scoreboard strip */
.board{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  background:linear-gradient(180deg,#1b1617,#120f10);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05)}
.jumper{width:52px;height:56px;position:relative;display:grid;place-items:center}
.jumper svg{position:absolute;inset:0}
.jumper b{position:relative;font-family:var(--display);font-weight:900;font-size:24px;color:var(--chalk);margin-top:8px}
.who .disp{font-size:24px;font-weight:800}
.who small{display:block;color:var(--dim);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.score{text-align:right}
.score .disp{font-size:34px;font-weight:900;color:var(--chalk)}
.score .disp span{color:var(--red)}
.score small{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-weight:700}
.lvl{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);font-weight:600}
.lvl .bar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red-deep),var(--red));border-radius:6px}
.lvl b{color:var(--gold);text-transform:uppercase;letter-spacing:.06em}

/* Round header */
.round{margin:22px 2px 10px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:4px 12px}
.round h1{font-size:clamp(46px,14vw,60px);font-weight:900;white-space:nowrap}
.round h1 em{font-style:normal;color:var(--red)}
.round .blk{margin-left:auto;padding-bottom:4px;text-align:right;font-size:13px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.round .blk b{display:block;color:var(--chalk);font-family:var(--display);font-size:20px;letter-spacing:.04em}

/* Hero next-up card */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;
  background:linear-gradient(150deg,var(--hero1) 0%,var(--red-deep) 58%,var(--abyss) 100%);color:#fff;
  box-shadow:0 18px 40px color-mix(in srgb,var(--red) 28%,transparent)}
.hero::after{content:"";position:absolute;right:-70px;top:-40px;width:260px;height:340px;border:3px solid rgba(255,255,255,.16);border-radius:50%;transform:rotate(-18deg)}
.hero::before{content:"";position:absolute;right:20px;top:46px;width:120px;height:160px;border:3px solid rgba(255,255,255,.10);border-radius:50%;transform:rotate(-18deg)}
.hero .tag{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.hero h2{font-size:44px;font-weight:900;margin:6px 0 4px;position:relative;z-index:1}
.hero p{margin:0 0 14px;opacity:.92;font-weight:500;position:relative;z-index:1;max-width:30ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.28)}
.kick{position:relative;z-index:1;margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--chalk);color:#140f10;border-radius:14px;padding:15px;font-family:var(--display);font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;
  box-shadow:0 6px 0 rgba(0,0,0,.25)}
.kick:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}

/* Fixture cards */
.sect{margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sect h3{font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.sect small{color:var(--dim);font-weight:600;font-size:13px}
.fixture{display:grid;gap:10px}
.fx{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--stand);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.fx .day{border-radius:12px;background:var(--seat);text-align:center;padding:7px 0}
.fx .day b{display:block;font-family:var(--display);font-size:22px;font-weight:900;text-transform:uppercase;line-height:1}
.fx .day small{font-size:12px;color:var(--dim);font-weight:600}
.fx .t{font-family:var(--display);font-size:22px;font-weight:800;text-transform:uppercase;line-height:1.02}
.fx .s{font-size:14px;color:var(--dim);margin-top:2px}
.pill{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:999px;white-space:nowrap}
.pill.todo{background:rgba(255,255,255,.07);color:var(--dim)}
.pill.done{background:rgba(49,195,116,.16);color:var(--turf)}
.pill.opt{background:rgba(243,181,63,.14);color:var(--gold)}
.fx.isdone{border-color:rgba(49,195,116,.35)}
.fx.isdone .day{background:rgba(49,195,116,.14)}

/* Ladder */
.ladder{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.rd{border-radius:12px;padding:8px 0 7px;text-align:center;background:var(--stand);border:1px solid var(--line)}
.rd small{display:block;font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.08em}
.rd b{font-family:var(--display);font-size:20px;font-weight:900}
.rd.W b{color:var(--turf)} .rd.D b{color:var(--gold)}
.rd.cur{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.rd.sel{background:var(--seat)}

/* Medals */
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.medal{background:var(--stand);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center}
.medal .m{width:48px;height:48px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:20px;
  background:#2a2325;color:#5a4f52;border:2px dashed #3a3134}
.medal.on .m{background:radial-gradient(circle at 35% 30%,#ffe29a,var(--gold) 55%,#a86d10);color:#3a2603;border:2px solid #ffd77a;box-shadow:0 4px 14px rgba(243,181,63,.35)}
.medal b{display:block;font-size:13px;font-weight:700;line-height:1.15}
.medal small{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.25}

/* Rows (drills) */
.card{background:var(--stand);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .n{font-weight:700;font-size:16.5px}
.row .c{font-size:13.5px;color:var(--dim);margin-top:1px}
.ctl{display:flex;align-items:center;gap:6px}
.step{width:34px;height:34px;border-radius:10px;background:var(--seat);font-size:20px;font-weight:700;display:grid;place-items:center}
.amt{min-width:56px;text-align:center;font-family:var(--display);font-weight:800;font-size:20px}
.amt small{display:block;font-family:var(--body);font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.swap{margin-top:6px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red);padding:4px 0}
.blockhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px}
.blockhead h4{margin:0;font-family:var(--display);font-size:21px;font-weight:800;text-transform:uppercase;color:var(--chalk)}
.blockhead small{color:var(--dim);font-weight:600;font-size:13px}
.simple{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:15px}
.simple:last-child{border-bottom:0}
.simple span:last-child{color:var(--dim);font-weight:600;white-space:nowrap}

/* Detail page */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--dim);padding:6px 0;font-size:15px}
.dhead h2{font-size:52px;font-weight:900;margin-top:8px}
.dhead p{margin:6px 0 0;color:var(--dim)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--stand);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:14px}
.seg button{padding:10px;border-radius:10px;font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;color:var(--dim)}
.seg button.on{background:var(--red);color:var(--on)}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom)) + 12px);
  background:linear-gradient(180deg,transparent,var(--night) 30%);z-index:5}
.sticky .in{max-width:520px;margin:0 auto;display:grid;gap:8px}
.big{width:100%;border-radius:16px;padding:16px;background:var(--red);color:var(--on);font-family:var(--display);font-size:28px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 6px 0 var(--red-deep)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 var(--red-deep)}
.link{font-weight:700;color:var(--dim);padding:6px;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.tip{display:flex;gap:10px;align-items:flex-start;background:rgba(243,181,63,.08);border:1px solid rgba(243,181,63,.22);border-radius:14px;padding:12px;margin-top:14px;font-size:14.5px}
.tip b{color:var(--gold)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:8px 10px calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom)) + 8px);background:rgba(12,10,11,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:grid;justify-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--chalk)}
.nav button.on svg{color:var(--red)}

/* Locker */
.field{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-size:13px;color:var(--dim);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.field input{background:var(--seat);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--chalk);font:inherit;font-size:17px;width:100%}
.tog{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-weight:600}
.tog:last-child{border-bottom:0}
.sw{width:52px;height:30px;border-radius:30px;background:var(--seat);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
.sw.on{background:var(--red)} .sw.on::after{transform:translateX(22px);background:#fff}
.danger{color:var(--red);font-weight:800;padding:12px 0;letter-spacing:.06em;text-transform:uppercase;font-size:14px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:520px;max-height:86%;overflow:auto;background:#1a1516;border-radius:24px 24px 0 0;padding:10px 16px calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom)) + 18px);border-top:1px solid var(--line);animation:up .22s cubic-bezier(.2,.9,.3,1)}
.grab{width:44px;height:5px;border-radius:5px;background:#3b3235;margin:4px auto 12px}
.sheet h3{font-family:var(--display);font-size:30px;font-weight:900;text-transform:uppercase}
.sheet p{color:var(--dim);margin:6px 0 12px}
.opt{width:100%;text-align:left;display:grid;gap:2px;padding:12px;border-radius:14px;background:var(--stand);border:1px solid var(--line);margin-bottom:8px}
.opt b{font-size:16.5px}
.opt small{color:var(--dim);font-size:13.5px}
.opt.cur{border-color:var(--red)}
.surprise{width:100%;padding:13px;border-radius:14px;background:var(--chalk);color:#140f10;font-family:var(--display);font-size:22px;font-weight:900;text-transform:uppercase;margin-bottom:12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Player */
.player{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;overflow:hidden;background:var(--night);
  padding:calc(var(--safe-area-inset-top,env(safe-area-inset-top)) + 10px) 16px calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom)) + 16px);transition:background .35s}
.player.work{background:radial-gradient(90% 60% at 50% 40%, color-mix(in srgb,var(--red) 28%,transparent), transparent 70%),var(--night)}
.player.rest{background:radial-gradient(90% 60% at 50% 40%, color-mix(in srgb,var(--rest) 20%,transparent), transparent 70%),var(--night)}
.player.ready{background:radial-gradient(90% 60% at 50% 40%, rgba(243,181,63,.18), transparent 70%),var(--night)}
.ptop{display:flex;justify-content:space-between;align-items:center;max-width:520px;width:100%;margin:0 auto}
.ptop .x{width:42px;height:42px;border-radius:12px;background:var(--stand);font-size:22px;display:grid;place-items:center}
.ptop .lab{text-align:center;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ptop .lab b{display:block;color:var(--chalk);font-family:var(--display);font-size:18px;letter-spacing:.06em}
.prog{height:4px;border-radius:4px;background:rgba(255,255,255,.08);max-width:520px;width:100%;margin:10px auto 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--chalk);transition:width .3s}
.oval{position:relative;flex:1 1 0;min-height:140px;overflow:hidden;display:grid;place-items:center;max-width:520px;width:100%;margin:6px auto 0}
#ov{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--ovw,240px);height:var(--ovh,288px)}
#ov svg{display:block;width:100%;height:100%}
.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.center .phase{font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.center .big-t{font-family:var(--display);font-weight:900;font-size:calc(var(--ovh,288px) * .3);line-height:.9;font-variant-numeric:tabular-nums}
.center .unit{font-family:var(--display);font-weight:800;font-size:clamp(14px,calc(var(--ovh,288px) * .06),22px);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.pname{text-align:center;max-width:520px;width:100%;margin:6px auto 0}
.pname h2{font-family:var(--display);font-size:clamp(28px,9vw,44px);font-weight:900;text-transform:uppercase;line-height:.95}
.pname p{margin:6px auto 0;color:var(--dim);max-width:34ch;font-size:15px;min-height:2.6em}
.next{display:flex;justify-content:center;margin-top:6px}
.next span{font-size:13px;font-weight:700;color:var(--dim);background:var(--stand);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.next b{color:var(--chalk)}
.pctl{display:grid;grid-template-columns:64px 1fr 64px;gap:12px;align-items:center;max-width:520px;width:100%;margin:14px auto 0}
.pctl .sm{height:64px;border-radius:18px;background:var(--stand);border:1px solid var(--line);display:grid;place-items:center}
.pctl .sm svg{width:26px;height:26px}
.pctl .main{height:72px;border-radius:20px;background:var(--chalk);color:#140f10;font-family:var(--display);font-size:30px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:10px}
.pctl .main.go{background:var(--turf);color:#06210f}
.pctl .main svg{width:26px;height:26px}

/* Finish */
.fin{position:fixed;inset:0;z-index:40;background:radial-gradient(100% 70% at 50% 30%, color-mix(in srgb,var(--red) 35%,transparent), var(--night) 72%);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}
.fin .goal{font-family:var(--display);font-weight:900;font-size:min(22vw,130px);line-height:.85;text-transform:uppercase;color:var(--chalk);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.fin .sub{font-family:var(--display);font-size:28px;font-weight:800;text-transform:uppercase;color:var(--red);margin-top:8px}
.fin p{color:var(--dim);max-width:30ch}
.fin .newm{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.fin .newm .medal{width:120px}
.fin .big{max-width:340px;margin-top:16px;font-size:24px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:41}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

.toast{position:fixed;left:50%;bottom:calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom)) + 92px);transform:translateX(-50%);background:var(--chalk);color:#140f10;font-weight:700;padding:10px 16px;border-radius:999px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:up .2s;white-space:nowrap}
.enter{animation:fade .25s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Sport picker */
.sports{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.sp{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;text-align:left;padding:10px;border-radius:14px;background:var(--stand);border:1px solid var(--line)}
.sp.cur{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.sp .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.sp b{display:block;font-family:var(--display);font-size:19px;font-weight:800;text-transform:uppercase;line-height:1}
.sp small{display:block;color:var(--dim);font-size:11.5px;line-height:1.2;margin-top:3px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px 0;font-size:14.5px;color:var(--chalk)}
.check input{width:22px;height:22px;accent-color:var(--red);flex:none;margin-top:1px}
.hint{font-size:13px;color:var(--dim);margin-top:2px}
.ready{width:100%;text-align:left;display:grid;gap:2px;padding:14px;border-radius:14px;background:var(--stand);border:1px solid var(--line);margin-bottom:8px}
.ready b{font-size:17px}.ready small{color:var(--dim);font-size:13.5px}
.ready.ok{border-color:rgba(49,195,116,.45)}.ready.lite{border-color:rgba(243,181,63,.45)}.ready.stop{border-color:rgba(255,90,90,.45)}
.safe .simple{display:block}.safe .simple b{display:block;color:var(--chalk);margin-bottom:2px}.safe .simple span{color:var(--dim)!important;white-space:normal!important;font-weight:500!important}
.band{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:13px;color:var(--dim);font-weight:600}
.band b{color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<div id="root"></div>
<canvas id="confetti" hidden></canvas>
<svg id="measure" width="0" height="0" style="position:absolute" aria-hidden="true"><path id="mpath" d=""/></svg>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
