name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk Full-Season.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Full-Season-apk
          path: Full-Season.apk

      - name: Publish a download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Full Season v1.0.${{ github.run_number }}
          body: |
            Download **Full-Season.apk** below on the Android phone, open it and tap Install.
            Installing a newer version over the old one keeps all progress.
          files: Full-Season.apk
          make_latest: true
